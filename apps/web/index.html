<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the layout reach under the notch and the home indicator;
      the safe-area insets in global.css put the interface back inside them.
      user-scalable=no is paired with 44pt touch targets, so nothing needs zooming (§11.1).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#F7B2C4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Jelly Bean" />
    <meta name="description" content="Raise a Jelly Bean. Keep it thriving." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/bean.svg" />
    <link rel="apple-touch-icon" href="/icons/bean-192.png" />
    <title>Jelly Bean Simulator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
